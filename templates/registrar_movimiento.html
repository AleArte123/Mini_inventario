{% extends 'base.html' %}

{% block title %}Registrar Movimiento{% endblock %}

{% block content %}
<h1 class="mb-4">Registrar Entrada o Salida</h1>

<form method="POST">
    <div class="mb-3">
        <label for="medicamento_id" class="form-label">Medicamento</label>
        <select name="medicamento_id" class="form-select" required>
            {% for med in medicamentos %}
            <option value="{{ med[0] }}">{{ med[1] }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label for="tipo" class="form-label">Tipo de Movimiento</label>
        <select name="tipo" class="form-select" required>
            <option value="entrada">Entrada</option>
            <option value="salida">Salida</option>
        </select>
    </div>

    <div class="mb-3">
        <label for="cantidad" class="form-label">Cantidad</label>
        <input type="number" name="cantidad" class="form-control" required>
    </div>

    <div class="mb-3">
        <label for="observacion" class="form-label">Observación (opcional)</label>
        <textarea name="observacion" class="form-control"></textarea>
    </div>

    <button type="submit" class="btn btn-primary">Registrar Movimiento</button>
    <a href="/movimientos" class="btn btn-secondary">Ver Historial</a>
</form>
{% endblock %}
